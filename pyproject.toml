[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hammy"
version = "0.1.0"
description = "HAMMY — Autonomous AI Virtual Syrian Hamster & Photoreal Blender Cycles Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
sim = [
    "mujoco>=3.2.0",
    "gymnasium>=1.0.0",
    "matplotlib>=3.9.0",
    "pytest>=8.0.0",
]

