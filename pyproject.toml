[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hammy"
version = "0.1.0"
description = "HAMMY — Autonomous AI Virtual Syrian Hamster & Photoreal Blender Cycles Pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
sim = [
    "mujoco>=3.2.0",
    "gymnasium>=1.0.0",
    "matplotlib>=3.9.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
addopts = "-p no:hypothesispytest"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::pytest.PytestDeprecationWarning",
    "ignore:.*conflicts with persistent instance.*:sqlalchemy.exc.SAWarning",
]


